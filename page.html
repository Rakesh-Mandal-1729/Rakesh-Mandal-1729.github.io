[hidden] { display: none !important; }

@media (max-width: 820px) {

  }).join('');

  $('photo').innerHTML = SITE.photo
    ? '<img src="' + SITE.photo + '" alt="Portrait of ' + SITE.name + '">'
    : '<span class="initials" aria-hidden="true">' + SITE.initials + '</span>';
  $('news').innerHTML = SITE.news.map(function (n) {
    return '<li><span class="date">' + n.date + '</span><span class="txt">' + n.text + '</span></li>';
  }).join('');
  $('about').innerHTML = paras(SITE.about);
  $('skills').innerHTML = SITE.skills.map(function (s) {
    return '<div class="cat"><strong>' + s.cat + ':</strong> <span>' + s.items + '</span></div>';
  }).join('');

  $('research-intro').innerHTML = paras(SITE.researchIntro);
  $('projects').innerHTML = SITE.projects.map(function (p) {
    var media = p.sampler
      ? '<div class="media"><div class="sampler">' +
          '<img id="flowFrame" src="assets/flow_7.webp" width="360" height="360" alt="Optimised cantilever structure generated by TopoFlow">' +
          '<div class="ctl"><span>noise</span><input type="range" id="tSlider" min="0" max="7" step="1" value="7" aria-label="Integration time from noise, t equals 1, to design, t equals 0"><span>design</span></div>' +
          '<div class="read"><span class="t" id="tValue">t = 0.00</span><button type="button" id="playBtn">Play</button></div>' +
        '</div><div class="caption">Drag to integrate the learned flow from noise (t = 1) to an optimised cantilever (t = 0).</div></div>'
      : '';
    return '<div class="row">' + media + '<div class="body"><h3>' + p.title + '</h3>' +
      '<div style="margin-bottom:8px"><span class="tag">' + p.status + '</span></div>' +
      '<p>' + p.text + '</p>' +
      '<div class="figs">' + p.figs.map(function (f) { return '<span><b>' + f[0] + '</b>' + f[1] + '</span>'; }).join('') + '</div>' +
      '<div class="tech">' + p.tech + '</div></div></div>';
  }).join('');
  $('directions').innerHTML = SITE.directions.map(function (d) {
    return '<div><h3>' + d.title + '</h3><p>' + d.text + '</p></div>';
  }).join('');
  $('earlier').innerHTML = SITE.earlier.map(item).join('');

  $('pubs').innerHTML = SITE.publications.map(function (p, i) {
    var title = p.link ? '<a class="t" href="' + p.link + '" target="_blank" rel="noopener">' + p.title + '</a>' : '<span class="t">' + p.title + '</span>';
    return '<div class="pub"><span class="n">' + (i + 1) + '.</span><div>' + title + '<br>' + p.authors +
      '<br><span class="tag">' + p.tag + '</span><span class="venue"><i>' + p.venue + '</i></span></div></div>';
  }).join('');

  $('experience').innerHTML = SITE.experience.map(item).join('');
  $('education').innerHTML = SITE.education.map(item).join('');
  $('bio').innerHTML = paras(SITE.bio);

  $('links').innerHTML = '<span class="email">' + SITE.email + '</span>' + SITE.links.map(function (l) {
    return '<a href="' + l.href + '" target="_blank" rel="noopener">' + l.label + '</a>';
  }).join('');
  $('copy').textContent = '© ' + new Date().getFullYear() + ' ' + SITE.name;

  /* views (hash navigation: #research, #publications, ...) */
  var VIEWS = [['home', 'Home'], ['research', 'Research'], ['publications', 'Publications'], ['experience', 'Experience'], ['bio', 'Bio']];
  $('nav').innerHTML = VIEWS.map(function (v) { return '<a href="#' + v[0] + '" data-link="' + v[0] + '">' + v[1] + '</a>'; }).join('');
  function show(name, scroll) {
    if (!VIEWS.some(function (v) { return v[0] === name; })) name = 'home';
    document.querySelectorAll('[data-view]').forEach(function (s) { s.hidden = s.getAttribute('data-view') !== name; });
    document.querySelectorAll('[data-link]').forEach(function (a) {
      if (a.getAttribute('data-link') === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), true); });
  show(location.hash.slice(1), false);

  /* TopoFlow sampler */
  var slider = $('tSlider');
  if (slider) {
    var frame = $('flowFrame'), tValue = $('tValue'), frames = [], timer = null;
    for (var i = 0; i < 8; i++) { var im = new Image(); im.src = 'assets/flow_' + i + '.webp'; frames.push(im.src); }
    var set = function (k) {
      frame.src = frames[k];
      var t = 1 - k / 7;
      tValue.textContent = 't = ' + t.toFixed(2);
      frame.alt = k === 7 ? 'Optimised cantilever structure generated by TopoFlow' : 'TopoFlow sample partway from noise to structure at t = ' + t.toFixed(2);
    };
    slider.addEventListener('input', function () { set(+slider.value); });
    $('playBtn').addEventListener('click', function () {
      if (timer) { clearInterval(timer); timer = null; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { slider.value = 7; set(7); return; }
      var k = 0; slider.value = 0; set(0);
      timer = setInterval(function () { k += 1; slider.value = k; set(k); if (k >= 7) { clearInterval(timer); timer = null; } }, 380);
    });
  }
})();
</script>
